<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Divalto Task Pane Add-in</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="divalto-app">

  <!-- PROFILE -->
  <section class="profile-card">
    <div class="avatar" id="avatar"></div>
    <div>
      <div class="username" id="user"></div>
      <div class="email" id="userEmail"></div>
    </div>
  </section>

  <!-- ACTIONS -->
  <main class="actions-card">
    <button class="action-btn secondary" id="btnSav">
      Évènement SAV
    </button>

    <button class="action-btn secondary" id="btnComm">
      Évènement Négoce
    </button>

    <button class="action-btn secondary" id="btnDDP">
      Entrée de demande de prix
    </button>

    <button class="action-btn secondary" id="btnCDE">
      Entrée de commande
    </button>

    <button class="action-btn secondary" id="btnDDI">
      Demande d'information
    </button>

    <!-- SAV Options Modal -->
    <div id="savOptionsModal" class="popup" style="display:none;">
      <div class="popup-header">
        Type d'évènement SAV
      </div>
      <div class="btnPopup" style="flex-direction: column; gap: 10px;">
        <button id="btnSavNew" class="action-btn secondary" style="margin-top:10px;">
          Nouveau
        </button>
        <button id="btnSavLinked" class="action-btn secondary" style="margin-top:10px;">
          Évènement lié
        </button>
        <button id="btnSavCancel" class="action-btn secondary" style="margin-top:10px; background: #999;">
          Retour
        </button>
      </div>
    </div>

    <!-- Child Events Popup -->
    <div id="childPopup" class="popup" style="display:none;">
      <div class="popup-header">
        <span id="evtCount">0 évènements trouvés</span>
      </div>
      
      <input 
        type="text" 
        id="eventSearchInput" 
        placeholder="Rechercher par code ou nom..." 
        class="event-search-input"
        style="display:none;"
      />

      <select id="childSelect" class="event-select"></select>
      <div class="btnPopup">
        <button id="confirmEvt" class="action-btn primary" style="margin-top:10px;">
          Confirmer
        </button>
        <button id="AnnuleEvt" class="action-btn secondary" style="margin-top:10px;">
          Retour
        </button>
      </div>
    </div>

    <!-- Confirmation Modal for Linked Event -->
    <div id="confirmLinkedModal" class="popup" style="display:none;">
      <div class="popup-header">
        Confirmer l'évènement lié
      </div>
      <div id="confirmLinkedText" style="padding: 12px; text-align: center; color: #333; margin-bottom: 10px;">
      </div>
      <div class="btnPopup">
        <button id="btnConfirmLinked" class="action-btn primary" style="margin-top:10px;">
          Confirmer
        </button>
        <button id="btnCancelLinked" class="action-btn secondary" style="margin-top:10px;">
          Retour
        </button>
      </div>
    </div>



    <div id="status" class="status"></div>
    <!-- <div id="pj" ></div> -->
    <div id="debug" style="
    background:#111;
    color:#0f0;
    padding:10px;
    margin-top:20px;
    height:200px;
    overflow:auto;
    font-size:12px;
    border-radius:6px;
    display:block;
"></div>

  </main>

</body>


</html>
